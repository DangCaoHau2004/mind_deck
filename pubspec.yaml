name: mind_deck
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  go_router: ^17.2.3
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  fl_chart: ^1.2.0
  get_it: ^9.2.1
  intl: ^0.20.2
  sqflite: ^2.4.2+1
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^10.2.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  path_provider: ^2.1.5
  path: ^1.9.1
  equatable: ^2.0.8
  image_picker: ^1.2.2
  permission_handler: ^12.0.1
  flutter_tts: ^4.2.5
  firebase_messaging: ^16.2.2
  firebase_core: ^4.9.0
  shared_preferences: ^2.5.5
  qr_flutter: ^4.1.0
  app_links: ^7.0.0
  flutter_launcher_icons: ^0.14.4
  firebase_crashlytics: ^5.2.7
  firebase_analytics: ^12.4.6
  hive: ^2.2.3
  bloc_concurrency: ^0.3.0
  flutter_timezone: ^5.1.1
  file_picker: ^13.1.0
  google_mobile_ads: ^9.2.0
  url_launcher: ^6.3.3
  connectivity_plus: ^7.3.2
  skeletonizer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
  fonts:
    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Black.otf
          weight: 900
        - asset: assets/fonts/SF-Pro-Display-Heavy.otf
          weight: 800
        - asset: assets/fonts/SF-Pro-Display-Bold.otf
          weight: 700
        - asset: assets/fonts/SF-Pro-Display-Semibold.otf
          weight: 600
        - asset: assets/fonts/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: assets/fonts/SF-Pro-Display-Regular.otf
          weight: 400
        - asset: assets/fonts/SF-Pro-Display-Light.otf
          weight: 300
        - asset: assets/fonts/SF-Pro-Display-Thin.otf
          weight: 200
        - asset: assets/fonts/SF-Pro-Display-Ultralight.otf
          weight: 100

  assets:
    - assets/langs/
    - assets/images/
    - assets/icons/
    - assets/images/logos/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logos/logo.png"